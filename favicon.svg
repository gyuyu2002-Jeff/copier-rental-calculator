<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background App Icon Style -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  
  <!-- Copier / MFP Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Top Document Feeder / Scanner Lid -->
    <rect x="30" y="24" width="68" height="12" rx="4" fill="#f8fafc" />
    <rect x="42" y="20" width="44" height="6" rx="2" fill="#cbd5e1" />
    <!-- Feeder Document -->
    <path d="M48 16 L74 16 L80 22 L48 22 Z" fill="#ffffff" opacity="0.9" />

    <!-- Scanner Bed Glass Line -->
    <rect x="28" y="36" width="72" height="4" rx="1" fill="#94a3b8" />

    <!-- Main Copier Body -->
    <rect x="24" y="40" width="80" height="52" rx="6" fill="#ffffff" />
    
    <!-- Control Touch Panel Screen -->
    <rect x="76" y="44" width="22" height="14" rx="3" fill="url(#screenGrad)" />
    <!-- Mini screen indicator lines -->
    <rect x="79" y="47" width="10" height="2" rx="1" fill="#ffffff" opacity="0.9" />
    <rect x="79" y="51" width="16" height="2" rx="1" fill="#ffffff" opacity="0.7" />
    <circle cx="93" cy="48" r="1.5" fill="#fef08a" />

    <!-- Output Tray Slot -->
    <rect x="30" y="44" width="42" height="18" rx="3" fill="#1e293b" />
    
    <!-- Printed Sheet Coming Out -->
    <path d="M34 48 L68 48 L68 62 L34 62 Z" fill="url(#paperGrad)" />
    <!-- Document colored lines representing print / chart -->
    <rect x="38" y="51" width="18" height="2" rx="1" fill="#2563eb" />
    <rect x="38" y="54" width="24" height="2" rx="1" fill="#059669" />
    <rect x="38" y="57" width="14" height="2" rx="1" fill="#d97706" />

    <!-- Middle Divider Line -->
    <line x1="24" y1="68" x2="104" y2="68" stroke="#e2e8f0" stroke-width="2" />

    <!-- Lower Paper Tray 1 -->
    <rect x="30" y="72" width="68" height="8" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="58" y="74" width="12" height="3" rx="1" fill="#94a3b8" />

    <!-- Lower Paper Tray 2 -->
    <rect x="30" y="82" width="68" height="8" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect x="58" y="84" width="12" height="3" rx="1" fill="#94a3b8" />

    <!-- Machine Base / Feet -->
    <rect x="32" y="92" width="10" height="4" rx="1" fill="#334155" />
    <rect x="86" y="92" width="10" height="4" rx="1" fill="#334155" />
  </g>

  <!-- Golden / Emerald Calculator Badge on Bottom-Right -->
  <g transform="translate(80, 80)">
    <circle cx="20" cy="20" r="18" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <!-- White Plus & Minus math icon -->
    <rect x="11" y="18" width="18" height="4" rx="2" fill="#ffffff" />
    <rect x="18" y="11" width="4" height="18" rx="2" fill="#ffffff" />
  </g>
</svg>